# sweet-scanner-app nginx — strict static hardening (same law as
# divinearts-site and manorlake-site), adapted for a Flutter WEB app:
# it MUST serve JavaScript, so the CSP allows 'self' scripts (the website
# scaffold's no-JS CSP does not apply here), and SPA routing falls back to
# index.html instead of 404. No version disclosure, GET/HEAD only, no
# dotfiles, no directory lists, no visitor logging.
# Replace the app under lib/ — keep this config law.
limit_req_zone $binary_remote_addr zone=app:1m rate=30r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    keepalive_timeout 30s;
    client_max_body_size 1k;
    access_log off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css text/plain application/json application/javascript image/svg+xml application/wasm;
    gzip_min_length 256;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_except GET { deny all; }
        limit_req zone=app burst=60 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
